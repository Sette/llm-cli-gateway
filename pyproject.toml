[project]
name = "llm-cli-gateway"
version = "0.2.0"
description = "Local OpenAI-compatible API (chat/completions) over agent CLIs (agy, claude, codex, and kiro) for development and testing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
]

[project.scripts]
llm-cli-gateway = "llm_cli_gateway.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "openai>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cli_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
